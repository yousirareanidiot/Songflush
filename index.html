<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Songflush — 당신만의 음악이 끊기지 않게</title>
  <meta name="description" content="곡이나 장르를 입력하면 비슷한 음악을 추천해요">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ① 상단 메뉴 (GNB) : common/header.js 가 그림 -->
  <header id="site-header" class="gnb"></header>

  <main class="main">
    <!-- ② 서비스 소개 문구 (히어로) -->
    <section class="hero">
      <h1 class="hero__title">당신만의 음악이 끊기지 않게</h1>
      <p class="hero__desc">곡이나 장르를 입력하면 비슷한 음악을 추천해요</p>
    </section>

    <!-- ③ 추천 시작 영역 -->
    <section class="panel" aria-label="추천 시작">
      <div class="tabs" role="tablist">
        <button type="button" class="tab is-active" role="tab" id="tab-song"
                aria-selected="true" aria-controls="panel-song">곡으로 추천</button>
        <button type="button" class="tab" role="tab" id="tab-genre"
                aria-selected="false" aria-controls="panel-genre" tabindex="-1">장르로 추천</button>
      </div>

      <!-- 곡으로 추천 탭 -->
      <form class="tab-panel" id="panel-song" role="tabpanel" aria-labelledby="tab-song" autocomplete="off">
        <div class="search-row">
          <label for="song-input" class="sr-only">곡 제목 또는 아티스트</label>
          <input type="text" id="song-input" class="search-input"
                 placeholder="곡 제목, 혹은 아티스트를 입력하세요">
          <button type="submit" class="btn-primary" id="song-submit" disabled>추천받기</button>
        </div>
      </form>

      <!-- 장르로 추천 탭 -->
      <form class="tab-panel" id="panel-genre" role="tabpanel" aria-labelledby="tab-genre" hidden>
        <div class="chips" id="genre-chips" aria-label="장르 선택 (여러 개 선택 가능)"></div>
        <div id="sub-genres"></div>
        <div class="genre-actions">
          <button type="submit" class="btn-primary" id="genre-submit" disabled>추천받기</button>
        </div>
      </form>
    </section>
  </main>

  <!-- ④ 푸터 : common/footer.js 가 그림 -->
  <footer id="site-footer" class="footer"></footer>

  <!-- 준비 중 안내 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="common/header.js"></script>
  <script src="common/footer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
